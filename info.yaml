  ui[0]: "Input Bit 0"
  ui[1]: "Input Bit 1"
  ui[2]: "Input Bit 2"
  ui[3]: "Input Bit 3"
  ui[4]: "Input Bit 4"
  ui[5]: "Input Bit 5"
  ui[6]: "Input Bit 6"
  ui[7]: "Input Bit 7"

  # Outputs
  uo[0]: "Output Bit 0"
  uo[1]: "Output Bit 1"
  uo[2]: "Output Bit 2"
  uo[3]: "Output Bit 3"
  uo[4]: "Output Bit 4"
  uo[5]: "Output Bit 5"
  uo[6]: "Output Bit 6"
  uo[7]: "Output Bit 7"

  # Bidirectional pins
  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

