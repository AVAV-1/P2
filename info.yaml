# Tiny Tapeout project information
project:
  title:        "2nd Order IIR Biquad Filter"
  author:       "ARYA VARDHAN"
  discord:      ""
  description:  "A digital 2nd order IIR biquad filter implemented using fixed-point arithmetic."
  language:     "Verilog"
  clock_hz:     50000000

  # How many tiles your design occupies?
  tiles: "1x1"

  top_module:  "tt_um_iir_biquad"

  source_files:
    - "project.v"

# The pinout of your project.
pinout:
